site_name: go-pki-scep
site_description: A Go library for the Simple Certificate Enrollment Protocol (SCEP, RFC 8894) with the message layer, an HTTP server handler and an HTTP client
site_url: https://misiektoja.github.io/go-pki-scep/
repo_url: https://github.com/misiektoja/go-pki-scep
repo_name: misiektoja/go-pki-scep
copyright: Licensed under the MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The pip requirements files live next to the pages for Dependabot but are not pages.
exclude_docs: |
  requirements.in
  requirements.txt

# The documentation build runs with --strict so every one of these findings fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  # The pages include the example programs and Example functions, which the tests build and run,
  # so the code on the site compiles.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Support matrix: support-matrix.md
  - Architecture: architecture.md
  - Server guide:
      - Implementing a CA: server/implementing-a-ca.md
      - Pending requests and throttling: server/pending-requests.md
      - Optional operations: server/optional-operations.md
      - Refusals and logging: server/refusals-and-logging.md
  - Client guide:
      - CA certificates and trust: client/ca-certificates.md
      - Enrollment and renewal: client/enrollment.md
      - Certificates and CRLs: client/certificates-and-crls.md
      - Capabilities, answers and retries: client/answers-and-retries.md
  - Message layer: message-layer.md
  - Reference:
      - Server options: reference/server-options.md
      - Client options: reference/client-options.md
      - Errors and status values: reference/errors.md
      - Compatibility policy: reference/compatibility.md
  - Interoperability:
      - Tested implementations: interoperability/tested-implementations.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
  - Security:
      - Security model: security/security-model.md
  - Development:
      - Development: development/development.md
      - Testing: development/testing.md
      - Release process: development/release-process.md
  - Known limitations: known-limitations.md
