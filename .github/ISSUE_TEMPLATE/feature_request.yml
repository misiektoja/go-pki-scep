name: Feature request
description: Ask for a capability that go-scep does not have yet
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The [scope section](https://github.com/misiektoja/go-scep/blob/main/README.md#scope) of the README lists the supported operations. The [limitations](https://github.com/misiektoja/go-scep/blob/main/README.md#limitations) name what is left out on purpose.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The enrollment or integration problem, not the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
      description: The behavior, option or function you would like. Name the RFC 8894 section when the request concerns the protocol.
    validations:
      required: true

  - type: input
    id: peer
    attributes:
      label: Peer this concerns
      placeholder: a router, an MDM, a CA product, other
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What you do today instead, if anything.
    validations:
      required: false
